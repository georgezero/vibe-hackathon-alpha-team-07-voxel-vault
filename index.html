<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Vault Co — Voxel Vault</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; }
    canvas { border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
    .info { color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="500"></canvas>
  <div class="info">Vibe Hackathon 2025 · Team 07 · Voxel Vault Co</div>
  <script type="module" src="./src/main.js"></script>
  <script>

// Voxel Vault — isometric grid, click to place/remove voxels to match target
const C={W:800,H:500,GRID:8,ISO_W:50,ISO_H:28};
let grid,target,score,hi,moves,state,frame;
function init(){grid=Array.from({length:C.GRID},()=>Array.from({length:C.GRID},()=>Array(4).fill(0)));target=Array.from({length:C.GRID},()=>Array.from({length:C.GRID},()=>Math.random()<0.4?1:0));score=0;hi=+(localStorage.getItem('vv-hi')||0);moves=30;state='playing';frame=0;}
function toIso(gx,gy){return{x:C.W/2+(gx-gy)*C.ISO_W/2,y:60+(gx+gy)*C.ISO_H/2};}
const canvas=document.getElementById('c');
canvas.addEventListener('click',e=>{
  if(state!=='playing')return;
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  let hit=false;
  for(let gy=C.GRID-1;gy>=0&&!hit;gy--)for(let gx=0;gx<C.GRID&&!hit;gx++){
    const {x,y}=toIso(gx,gy);
    if(mx>x-C.ISO_W/2&&mx<x+C.ISO_W/2&&my>y&&my<y+C.ISO_H){
      const h=grid[gx][gy].filter(Boolean).length;
      if(h<3)grid[gx][gy][h]=1;
      else grid[gx][gy]=[0,0,0,0];
      moves--;hit=true;
      // Check score
      let match=0;
      for(let i=0;i<C.GRID;i++)for(let j=0;j<C.GRID;j++){const placed=grid[i][j].filter(Boolean).length>0;if(placed===!!target[i][j])match++;}
      score=Math.round(match/(C.GRID*C.GRID)*100);
      if(score>=80||moves<=0){hi=Math.max(hi,score);localStorage.setItem('vv-hi',hi);state='done';}
    }
  }
});
canvas.addEventListener('dblclick',()=>{if(state==='done')init();});
function draw(ctx){
  ctx.fillStyle='#0a0f1e';ctx.fillRect(0,0,C.W,C.H);
  ctx.fillStyle='#aaa';ctx.font='14px monospace';ctx.textAlign='center';
  ctx.fillText(`VOXEL VAULT — Match ${score}%  Moves left: ${moves}  Best: ${hi}%  (dbl-click reset)`,C.W/2,22);
  // Draw isometric grid
  for(let gy=0;gy<C.GRID;gy++)for(let gx=0;gx<C.GRID;gx++){
    const {x,y}=toIso(gx,gy);
    const h=grid[gx][gy].filter(Boolean).length;
    const tgt=target[gx][gy];
    // Base tile
    ctx.fillStyle=tgt?'rgba(6,182,212,0.15)':'rgba(50,50,60,0.4)';
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+C.ISO_W/2,y+C.ISO_H/2);ctx.lineTo(x,y+C.ISO_H);ctx.lineTo(x-C.ISO_W/2,y+C.ISO_H/2);ctx.closePath();ctx.fill();
    // Voxels
    for(let hh=0;hh<h;hh++){
      const vy=y-hh*16;const c=`rgba(6,182,212,${0.5+hh*0.2})`;
      ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,vy);ctx.lineTo(x+C.ISO_W/2,vy+C.ISO_H/2);ctx.lineTo(x,vy+C.ISO_H);ctx.lineTo(x-C.ISO_W/2,vy+C.ISO_H/2);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.stroke();
      // Right face
      ctx.fillStyle='rgba(0,100,120,0.6)';ctx.beginPath();ctx.moveTo(x,vy+C.ISO_H);ctx.lineTo(x+C.ISO_W/2,vy+C.ISO_H/2);ctx.lineTo(x+C.ISO_W/2,vy+C.ISO_H/2+16);ctx.lineTo(x,vy+C.ISO_H+16);ctx.closePath();ctx.fill();
    }
  }
  if(state==='done'){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,C.W,C.H);ctx.fillStyle=score>=80?'#06b6d4':'#06b6d4';ctx.font='bold 40px monospace';ctx.textAlign='center';ctx.fillText(score>=80?'SCAN MATCHED!':'RECONSTRUCTION COMPLETE',C.W/2,220);ctx.fillStyle='white';ctx.font='22px monospace';ctx.fillText(`Accuracy: ${score}%  Best: ${hi}%`,C.W/2,280);ctx.fillStyle='#aaa';ctx.font='18px monospace';ctx.fillText('Double-click to try again',C.W/2,350);}
}
init();
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  function loop() {
    if(typeof update === 'function') update();
    if(typeof draw === 'function') draw(ctx);
    requestAnimationFrame(loop);
  }
  loop();
  </script>
</body>
</html>
