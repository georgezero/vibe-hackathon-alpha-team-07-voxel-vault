<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Vault Co — Voxel Vault</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0f1e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; }
    canvas { border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
    .info { color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <canvas id="c" width="800" height="500"></canvas>
  <div class="info">Vibe Hackathon 2026 · Team 07 · Voxel Vault Co</div>
  <script>
// Voxel Vault — catch the target anatomy voxel, dodge all others
const C={W:800,H:500};
const ANATOMY=['LIVER','KIDNEY','LUNG','HEART','BONE','SPLEEN','PANCREAS','BLADDER'];
const COLORS={LIVER:'#f4a26d',KIDNEY:'#c77dff',LUNG:'#80b4c8',HEART:'#ff6b6b',BONE:'#e8e8c8',SPLEEN:'#8bc34a',PANCREAS:'#ffd54f',BLADDER:'#4dd0e1'};

let g;
function init(){
  g={phase:'start',score:0,hi:+(localStorage.getItem('vv-hi')||0),lives:3,
    platform:{x:360,w:80},frame:0,voxels:[],
    target:ANATOMY[Math.floor(Math.random()*ANATOMY.length)],
    catchCount:0,combo:0,particles:[]};
}
init();
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){if(g.phase==='start'||g.phase==='gameover'){init();g.phase='playing';}}
  e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

function spawn(){
  const isTarget=Math.random()<0.42;
  const type=isTarget?g.target:ANATOMY.filter(a=>a!==g.target)[Math.floor(Math.random()*(ANATOMY.length-1))];
  g.voxels.push({
    x:20+Math.random()*(C.W-120),y:-44,w:74,h:30,type,
    speed:1.6+Math.floor(g.score/300)*0.12+Math.random()*0.5,
    alive:true
  });
}

function update(){
  if(g.phase!=='playing')return;
  g.frame++;
  if(keys['ArrowLeft'])g.platform.x=Math.max(0,g.platform.x-7);
  if(keys['ArrowRight'])g.platform.x=Math.min(C.W-g.platform.w,g.platform.x+7);
  // Particles
  g.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.14;p.life--;});
  g.particles=g.particles.filter(p=>p.life>0);
  // Spawn
  const intv=Math.max(42,95-Math.floor(g.score/200)*5);
  if(g.frame%intv===0)spawn();
  // Voxels
  const py=C.H-58;
  g.voxels.forEach(v=>{
    if(!v.alive)return;
    v.y+=v.speed;
    // Catch
    if(v.y+v.h>=py&&v.y<py+18&&v.x+v.w>g.platform.x&&v.x<g.platform.x+g.platform.w){
      v.alive=false;
      if(v.type===g.target){
        g.combo++;
        const pts=10*Math.min(g.combo,5);
        g.score+=pts;g.catchCount++;
        for(let i=0;i<8;i++)g.particles.push({x:v.x+v.w/2,y:py,vx:(Math.random()-0.5)*5,vy:-2.5-Math.random()*3,life:22,color:COLORS[v.type]});
        if(g.catchCount>0&&g.catchCount%5===0){
          const others=ANATOMY.filter(a=>a!==g.target);
          g.target=others[Math.floor(Math.random()*others.length)];
        }
      } else {
        g.lives--;g.combo=0;
        for(let i=0;i<5;i++)g.particles.push({x:v.x+v.w/2,y:py,vx:(Math.random()-0.5)*4,vy:-1.5-Math.random()*2.5,life:18,color:'#ff4444'});
        if(g.lives<=0){if(g.score>g.hi){g.hi=g.score;localStorage.setItem('vv-hi',g.hi);}g.phase='gameover';}
      }
      if(g.score>g.hi){g.hi=g.score;localStorage.setItem('vv-hi',g.hi);}
    }
    // Missed target
    if(v.y>C.H+10){
      if(v.type===g.target){g.lives--;g.combo=0;if(g.lives<=0){if(g.score>g.hi){g.hi=g.score;localStorage.setItem('vv-hi',g.hi);}g.phase='gameover';}}
      v.alive=false;
    }
  });
  g.voxels=g.voxels.filter(v=>v.alive);
}

function drawVoxel(ctx,x,y,w,h,label,color,isTarget){
  const d=5;
  // Front face
  ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
  // Top highlight
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(x,y,w,d);
  // Bottom shadow
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(x,y+h-d,w,d);
  // Right face
  ctx.fillStyle='rgba(255,255,255,0.09)';
  ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+d,y-d);ctx.lineTo(x+w+d,y+h-d);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
  // Top face
  ctx.fillStyle='rgba(255,255,255,0.14)';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d,y-d);ctx.lineTo(x+w+d,y-d);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();
  if(isTarget){ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,h-2);}
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h/2+3.5);
}

function draw(ctx){
  ctx.fillStyle='#0a0f1e';ctx.fillRect(0,0,C.W,C.H);
  if(g.phase==='start'){
    ctx.fillStyle='#a78bfa';ctx.font='bold 46px monospace';ctx.textAlign='center';ctx.fillText('VOXEL VAULT',C.W/2,155);
    ctx.fillStyle='#94a3b8';ctx.font='15px monospace';
    ctx.fillText('← →  Move scanner platform',C.W/2,216);
    ctx.fillText('Catch the TARGET anatomy voxel · dodge all others',C.W/2,242);
    ctx.fillText('Target changes every 5 catches',C.W/2,268);
    ctx.fillStyle='#a78bfa';ctx.font='22px monospace';ctx.fillText('▶  SPACE TO START',C.W/2,348);
    ctx.fillStyle='#334';ctx.font='13px monospace';ctx.fillText('High Score: '+g.hi,C.W/2,408);
    return;
  }
  // Target header bar
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,0,C.W,44);
  ctx.fillStyle='#94a3b8';ctx.font='12px monospace';ctx.textAlign='left';ctx.fillText('SCAN TARGET:',10,26);
  ctx.fillStyle=COLORS[g.target];ctx.font='bold 16px monospace';ctx.fillText(g.target,118,26);
  // Preview voxel in header
  drawVoxel(ctx,240,7,62,26,g.target,COLORS[g.target],false);
  // HUD right
  ctx.fillStyle='white';ctx.font='bold 14px monospace';ctx.textAlign='right';ctx.fillText('SCORE: '+g.score,C.W-8,18);
  ctx.fillStyle='#556';ctx.font='11px monospace';ctx.fillText('BEST: '+g.hi,C.W-8,36);
  // Combo
  if(g.combo>1){ctx.fillStyle='#ffd700';ctx.font='bold 13px monospace';ctx.textAlign='left';ctx.fillText('×'+g.combo+' COMBO',10,C.H-58);}
  // Particles
  g.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/22);ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6);});
  ctx.globalAlpha=1;
  // Voxels
  g.voxels.forEach(v=>{if(!v.alive)return;drawVoxel(ctx,v.x,v.y,v.w,v.h,v.type,COLORS[v.type],v.type===g.target);});
  // Platform
  const py=C.H-58;
  ctx.fillStyle='#7c3aed';ctx.fillRect(g.platform.x,py,g.platform.w,12);
  ctx.fillStyle='rgba(167,139,250,0.28)';ctx.fillRect(g.platform.x+3,py+12,g.platform.w-6,4);
  // Lives
  ctx.fillStyle='#556';ctx.font='10px monospace';ctx.textAlign='right';ctx.fillText('LIVES',C.W-10,C.H-56);
  for(let i=0;i<3;i++){ctx.fillStyle=i<g.lives?'#a78bfa':'#1e1830';ctx.fillRect(C.W-10-3*20+i*20,C.H-50,14,10);}
  // Game over
  if(g.phase==='gameover'){
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,C.W,C.H);
    ctx.fillStyle='#ff4444';ctx.font='bold 40px monospace';ctx.textAlign='center';ctx.fillText('VAULT BREACH',C.W/2,185);
    ctx.fillStyle='#aaa';ctx.font='18px monospace';ctx.fillText('Score: '+g.score,C.W/2,248);
    if(g.score>0&&g.score>=g.hi){ctx.fillStyle='#ffd700';ctx.font='15px monospace';ctx.fillText('NEW HIGH SCORE!',C.W/2,282);}
    ctx.fillStyle='#a78bfa';ctx.font='18px monospace';ctx.fillText('SPACE to retry',C.W/2,358);
  }
}

const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
(function loop(){update();draw(ctx);requestAnimationFrame(loop);})();
  </script>
</body>
</html>
